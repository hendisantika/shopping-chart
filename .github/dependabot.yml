# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # ---------------------------------------------------------------------------
  # Maven dependencies (pom.xml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    rebase-strategy: auto
    # Group related libraries so they are bumped together in a single PR
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      jdbc-drivers:
        patterns:
          - "com.mysql*"
          - "org.postgresql*"
          - "com.microsoft.sqlserver*"
          - "com.oracle.database.jdbc*"
          - "net.sourceforge.jtds*"
      apache-commons:
        patterns:
          - "commons-*"
          - "org.apache.commons*"
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework*"
          - "org.testcontainers*"
    ignore:
      # Major Spring Boot upgrades need manual migration work
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  # ---------------------------------------------------------------------------
  # GitHub Actions used in .github/workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
